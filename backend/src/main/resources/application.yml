spring:
  application:
    name: analytics-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analytics_platform}
    username: ${DB_USERNAME:analytics_user}
    password: ${DB_PASSWORD:analytics_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

automation:
  enabled: ${AUTOMATION_ENABLED:true}
  cron-expression: ${AUTOMATION_CRON:0 0 */6 * * *} # Every 6 hours
  low-productivity-threshold: ${LOW_PRODUCTIVITY_THRESHOLD:50.0}
  high-error-rate-threshold: ${HIGH_ERROR_RATE_THRESHOLD:5.0}
  deadline-warning-days: ${DEADLINE_WARNING_DAYS:2}

logging:
  level:
    com.analytics.platform: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
